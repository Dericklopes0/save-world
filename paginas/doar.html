<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doar - Save World</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header class="topo">
    <h1>Save World</h1>
    <nav>
      <a href="../index.html">Início</a>
      <a href="sobre.html">Sobre</a>
      <a href="tutorial.html">Como usar</a>
      <a href="campanhas.html" aria-current="page">Campanhas</a>
      <a href="materiais.html">Materiais necessários</a>
      <a href="ajuda.html">Ajuda</a>
    </nav>
  </header>

  <main>
    <form class="caixa estreita" action="campanhas.html" method="get">
      <h2>Registrar minha doação</h2>
      <label for="nome">Seu nome</label>
      <input type="text" id="nome" name="nome" minlength="2" required>
      <label for="campanha">Campanha</label>
      <select id="campanha" name="campanha">
        <option>Cestas básicas de Natal</option>
        <option>Reforma do abrigo</option>
      </select>
      <label for="quantidade">Valor (R$) ou quantidade</label>
      <input type="number" id="quantidade" name="quantidade" min="0.01" step="0.01" required placeholder="Ex: 50">
      <label for="data">Data da doação</label>
      <input type="date" id="data" name="data" required>
      <p><button type="submit" class="botao">Confirmar doação</button></p>
    </form>
  </main>

  <footer>
    <p>Save World</p>
  </footer>

</body>
</html>
